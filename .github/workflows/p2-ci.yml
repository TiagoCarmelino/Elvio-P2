name: P2 - testes, cobertura e build

on:
  push:
    branches: [p2-unisagrado]
  pull_request:
    branches: [p2-unisagrado]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Testes isolados e cobertura LCOV
        run: |
          set -o pipefail
          mkdir -p test-results
          pnpm run test:coverage 2>&1 | tee test-results/unitarios.log
      - name: Lint
        run: pnpm run lint
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm run build
      - name: Publicar log e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-testes-e-cobertura
          path: |
            test-results/unitarios.log
            coverage/p2/lcov.info
          if-no-files-found: warn
